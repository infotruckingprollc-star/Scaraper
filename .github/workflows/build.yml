name: Build EXE
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install playwright openpyxl pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name DOT_Scraper --collect-all playwright dot_scraper.py
      - uses: actions/upload-artifact@v4
        with:
          name: DOT_Scraper
          path: dist/DOT_Scraper.exe
